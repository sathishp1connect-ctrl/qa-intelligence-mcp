name: QA Intelligence CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Python MCP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp pytest pydantic

      - name: Run Python Tests
        run: pytest -q

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-demo/package-lock.json

      - name: Install Playwright Dependencies
        working-directory: playwright-demo
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: playwright-demo
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: playwright-demo
        run: npx playwright test --reporter=html
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-demo/playwright-report/